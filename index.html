<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes de Rick and Morty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container py-4">
        <h1 class="text-center mb-4">Personajes de Rick and Morty</h1>


        <div id="mensaje" class="alert d-none" role="alert"></div>


        <div id="contenedor_personajes" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></div>


        <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
            <button type="button" class="btn btn-secondary" id="boton_anterior" disabled>&lt; Anterior</button>
            <span id="texto_pagina" class="fw-bold">Página 1 de 42</span>
            <button type="button" class="btn btn-primary" id="boton_siguiente">Siguiente &gt;</button>
        </div>
    </div>


    <div class="modal fade" id="modal_detalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="titulo_modal">Detalle del personaje</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="cuerpo_modal"></div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="personajes.js"></script>

</body>
</html>
